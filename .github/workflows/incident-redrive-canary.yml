name: incident-redrive-canary

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected non-production Environment containing the isolated redrive route
        type: environment
        required: true

permissions: {}

jobs:
  redrive-canary:
    name: OIDC non-production redrive canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    concurrency:
      group: incident-redrive-canary-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REDRIVE_CANARY_ROLE_ARN: ${{ vars.AWS_REDRIVE_CANARY_ROLE_ARN }}
      NETWORK_INCIDENT_REDRIVE_OIDC_SUBJECT: ${{ vars.NETWORK_INCIDENT_REDRIVE_OIDC_SUBJECT }}
      NETWORK_INCIDENT_QUEUE_ARN: ${{ vars.NETWORK_INCIDENT_QUEUE_ARN }}
      NETWORK_INCIDENT_FAULT_QUEUE_ARN: ${{ vars.NETWORK_INCIDENT_FAULT_QUEUE_ARN }}
      NETWORK_INCIDENT_FAULT_DLQ_ARN: ${{ vars.NETWORK_INCIDENT_FAULT_DLQ_ARN }}
      NETWORK_INCIDENT_REDRIVE_EVIDENCE_KEY_ARN: ${{ vars.NETWORK_INCIDENT_REDRIVE_EVIDENCE_KEY_ARN }}
      NETWORK_INCIDENT_REDRIVE_ARCHIVE_BUCKET: ${{ vars.NETWORK_INCIDENT_REDRIVE_ARCHIVE_BUCKET }}
      NETWORK_INCIDENT_REDRIVE_ARCHIVE_RETENTION_DAYS: ${{ vars.NETWORK_INCIDENT_REDRIVE_ARCHIVE_RETENTION_DAYS }}

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate isolated redrive route
        run: >-
          python scripts/build_network_incident_redrive_route.py
          --production-queue-arn "$NETWORK_INCIDENT_QUEUE_ARN"
          --fault-queue-arn "$NETWORK_INCIDENT_FAULT_QUEUE_ARN"
          --fault-dead-letter-queue-arn "$NETWORK_INCIDENT_FAULT_DLQ_ARN"
          --redrive-canary-role-arn "$AWS_REDRIVE_CANARY_ROLE_ARN"
          --expected-account-id "$AWS_ACCOUNT_ID"
          --expected-region "$AWS_REGION"
          --output "$RUNNER_TEMP/redrive-route.json"

      - name: Exchange GitHub OIDC token for short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_REDRIVE_CANARY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 900
          role-session-name: incident-redrive-${{ github.run_id }}-${{ github.run_attempt }}
          retry-max-attempts: 3
          mask-aws-account-id: true

      - name: Verify live IAM and SQS drill boundary
        id: redrive-preflight
        run: >-
          python scripts/verify_network_incident_redrive_prerequisites.py
          "$RUNNER_TEMP/redrive-route.json"
          --role-arn "$AWS_REDRIVE_CANARY_ROLE_ARN"
          --evidence-key-arn "$NETWORK_INCIDENT_REDRIVE_EVIDENCE_KEY_ARN"
          --expected-oidc-subject "$NETWORK_INCIDENT_REDRIVE_OIDC_SUBJECT"
          --authorization-id "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          --timeout-seconds 30
          > "$RUNNER_TEMP/redrive-preflight-receipt.json"

      - name: Run bounded poison-message redrive drill
        id: redrive-canary
        shell: bash
        run: |
          set +e
          python scripts/run_network_incident_redrive_canary.py \
            "$RUNNER_TEMP/redrive-route.json" \
            --preflight-receipt "$RUNNER_TEMP/redrive-preflight-receipt.json" \
            --authorization-id "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --call-timeout-seconds 30 \
            --dlq-receive-attempts 5 \
            --wait-seconds 5 \
            > "$RUNNER_TEMP/redrive-canary-receipt.json"
          canary_status=$?
          set -e
          if [[ "$canary_status" -ne 0 ]]; then
            echo "The isolated redrive canary failed; inspect the archived JSON receipt." >&2
            exit "$canary_status"
          fi

      - name: Sign and verify the paired evidence
        id: redrive-evidence
        shell: bash
        run: |
          evidence_tmp="$RUNNER_TEMP/redrive-evidence-envelope.json.tmp"
          trap 'rm -f -- "$evidence_tmp"' EXIT
          python scripts/seal_network_incident_redrive_evidence.py \
            "$RUNNER_TEMP/redrive-route.json" \
            --preflight-receipt "$RUNNER_TEMP/redrive-preflight-receipt.json" \
            --canary-receipt "$RUNNER_TEMP/redrive-canary-receipt.json" \
            --authorization-id "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --kms-key-arn "$NETWORK_INCIDENT_REDRIVE_EVIDENCE_KEY_ARN" \
            --timeout-seconds 30 \
            > "$evidence_tmp"
          mv -- "$evidence_tmp" "$RUNNER_TEMP/redrive-evidence-envelope.json"

      - name: Retain signed evidence in S3 Object Lock
        id: redrive-retention
        if: ${{ vars.NETWORK_INCIDENT_REDRIVE_ARCHIVE_BUCKET != '' }}
        run: >-
          python scripts/archive_network_incident_redrive_evidence.py
          "$RUNNER_TEMP/redrive-evidence-envelope.json"
          --bucket "$NETWORK_INCIDENT_REDRIVE_ARCHIVE_BUCKET"
          --owner-account-id "$AWS_ACCOUNT_ID"
          --region "$AWS_REGION"
          --retention-days "$NETWORK_INCIDENT_REDRIVE_ARCHIVE_RETENTION_DAYS"
          --workflow-run-id "$GITHUB_RUN_ID"
          --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
          --timeout-seconds 30
          > "$RUNNER_TEMP/redrive-evidence-retention-receipt.json"

      - name: Archive JSON evidence
        if: ${{ always() && (steps.redrive-preflight.outcome == 'success' || steps.redrive-preflight.outcome == 'failure' || steps.redrive-canary.outcome == 'success' || steps.redrive-canary.outcome == 'failure' || steps.redrive-evidence.outcome == 'success' || steps.redrive-evidence.outcome == 'failure' || steps.redrive-retention.outcome == 'success' || steps.redrive-retention.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: incident-redrive-canary-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/redrive-preflight-receipt.json
            ${{ runner.temp }}/redrive-canary-receipt.json
            ${{ runner.temp }}/redrive-evidence-envelope.json
            ${{ runner.temp }}/redrive-evidence-retention-receipt.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
