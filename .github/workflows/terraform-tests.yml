name: terraform-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  slo-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform format
        run: terraform -chdir=infra fmt -check -diff
      - name: Terraform init without backend
        run: terraform -chdir=infra init -backend=false -input=false
      - name: Mock-provider SLO contract tests
        run: terraform -chdir=infra test -test-directory=tests
